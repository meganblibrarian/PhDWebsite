  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ight:700;font-size:16px;color:#2E3528;\">{{ dy.name }}<\u002Fspan>\n                  <sc-for list=\"{{ dy.events }}\" as=\"ev\" hint-placeholder-count=\"0\"><span style=\"font-size:10.5px;font-weight:700;color:#fff;background:{{ ev.color }};padding:2px 9px;border-radius:999px;\">{{ ev.label }}<\u002Fspan><\u002Fsc-for>\n                <\u002Fspan>\n                <span style=\"font-weight:700;font-size:13px;color:var(--accent,#84976F);letter-spacing:.04em;white-space:nowrap;\">{{ dy.date }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"flex:1;background:repeating-linear-gradient(#fff,#fff 25px,#F0F2EB 26px);\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:14px;margin-top:13px;\">\n          <div style=\"flex:1;border:1px solid #E2E6DA;border-radius:13px;overflow:hidden;\">\n            <div style=\"background:var(--accent,#84976F);color:#fff;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:6px 14px;\">Lessons &amp; Objectives<\u002Fdiv>\n            <div style=\"height:96px;background:repeating-linear-gradient(#fff,#fff 23px,#F0F2EB 24px);\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;border:1px solid #E2E6DA;border-radius:13px;overflow:hidden;\">\n            <div style=\"background:#2E3528;color:#fff;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:6px 14px;\">Notes &amp; Reminders<\u002Fdiv>\n            <div style=\"height:96px;background:repeating-linear-gradient(#fff,#fff 23px,#F0F2EB 24px);\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- GENERAL NOTES PAGE (follows each weekly page) -->\n    <div class=\"page\" id=\"{{ wk.notesId }}\" style=\"width:816px;height:1056px;box-sizing:border-box;background:#ffffff;position:relative;overflow:hidden;font-family:'Libre Franklin',sans-serif;color:#2E3528;\">\n      <div style=\"height:100%;box-sizing:border-box;padding:50px 52px 44px;display:flex;flex-direction:column;\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid var(--accent,#84976F);padding-bottom:12px;margin-bottom:20px;\">\n          <div>\n            <div style=\"font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent,#84976F);font-weight:700;\">Notes<\u002Fdiv>\n            <div style=\"font-size:32px;font-weight:800;letter-spacing:-.015em;line-height:1.02;\">{{ wk.title }}<\u002Fdiv>\n          <\u002Fdiv>\n          <a href=\"#{{ wk.id }}\" class=\"noprint\" style=\"text-decoration:none;background:var(--soft,#EEF1E8);color:var(--accent,#84976F);font-size:12px;font-weight:700;padding:7px 14px;border-radius:999px;white-space:nowrap;\" style-hover=\"background:#E1E7D6;\">↑ Weekly Plan<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:16px;margin-bottom:16px;\">\n          <div style=\"flex:1;border:1px solid #E2E6DA;border-radius:13px;overflow:hidden;\">\n            <div style=\"background:var(--accent,#84976F);color:#fff;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:6px 14px;\">To Do<\u002Fdiv>\n            <div style=\"height:150px;background:repeating-linear-gradient(#fff,#fff 28px,#F0F2EB 29px);\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;border:1px solid #E2E6DA;border-radius:13px;overflow:hidden;\">\n            <div style=\"background:#2E3528;color:#fff;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:6px 14px;\">Meetings &amp; Calls<\u002Fdiv>\n            <div style=\"height:150px;background:repeating-linear-gradient(#fff,#fff 28px,#F0F2EB 29px);\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:12px;\">\n          <span style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent,#84976F);font-weight:700;\">General Notes<\u002Fspan>\n          <span style=\"flex:1;height:1px;background:#E2E6DA;\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:1;border:1px solid #E2E6DA;border-radius:14px;background-color:#fff;background-image:radial-gradient(#CBD2BF 1.4px, transparent 1.4px);background-size:26px 26px;background-position:14px 14px;\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n<\u002Fdiv>\n\n<\u002Fsc-for>\n\n<!-- ===================== NOTES SECTION ===================== -->\n<div class=\"page\" id=\"notes\" style=\"width:816px;height:1056px;box-sizing:border-box;background:#ffffff;position:relative;overflow:hidden;font-family:'Libre Franklin',sans-serif;color:#2E3528;\">\n  <div style=\"height:100%;box-sizing:border-box;padding:56px 56px 48px;display:flex;flex-direction:column;\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid var(--accent,#84976F);padding-bottom:13px;margin-bottom:22px;\">\n      <div>\n        <div style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent,#84976F);font-weight:700;\">Open Pages<\u002Fdiv>\n        <div style=\"font-size:46px;font-weight:800;letter-spacing:-.01em;line-height:1;\">Notes<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#7A8270;font-weight:600;\">Plans · Meetings · Ideas<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;border:1px solid #E2E6DA;border-radius:14px;background-color:#fff;background-image:radial-gradient(#CBD2BF 1.4px, transparent 1.4px);background-size:26px 26px;background-position:14px 14px;\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ notesExtra }}\" as=\"n\" hint-placeholder-count=\"5\">\n  <div class=\"page\" style=\"width:816px;height:1056px;box-sizing:border-box;background:#ffffff;position:relative;overflow:hidden;font-family:'Libre Franklin',sans-serif;color:#2E3528;\">\n    <div style=\"height:100%;box-sizing:border-box;padding:56px;display:flex;flex-direction:column;\">\n      <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:20px;\">\n        <span style=\"height:3px;width:48px;background:var(--accent,#84976F);border-radius:2px;\"><\u002Fspan>\n        <span style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent,#84976F);font-weight:700;\">Notes<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex:1;border:1px solid #E2E6DA;border-radius:14px;background-color:#fff;background-image:radial-gradient(#CBD2BF 1.4px, transparent 1.4px);background-size:26px 26px;background-position:14px 14px;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-for>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: 816, &quot;height&quot;: 1056 },\n  &quot;seasonalThemes&quot;: {\n    &quot;editor&quot;: &quot;boolean&quot;,\n    &quot;default&quot;: true,\n    &quot;tsType&quot;: &quot;boolean&quot;\n  },\n  &quot;accentColor&quot;: {\n    &quot;editor&quot;: &quot;color&quot;,\n    &quot;default&quot;: &quot;#84976F&quot;,\n    &quot;options&quot;: [&quot;#84976F&quot;, &quot;#4F6478&quot;, &quot;#BD6B4E&quot;, &quot;#7A5C84&quot;],\n    &quot;tsType&quot;: &quot;string&quot;\n  },\n  &quot;showCalendarEvents&quot;: {\n    &quot;editor&quot;: &quot;boolean&quot;,\n    &quot;default&quot;: true,\n    &quot;tsType&quot;: &quot;boolean&quot;\n  },\n  &quot;weekendShading&quot;: {\n    &quot;editor&quot;: &quot;boolean&quot;,\n    &quot;default&quot;: true,\n    &quot;tsType&quot;: &quot;boolean&quot;\n  }\n}\">\nclass Component extends DCLogic {\n  build() {\n    const accentColor = this.props.accentColor || '#84976F';\n    const SOFTMAP = { '#84976F':'#EEF1E8', '#4F6478':'#E7ECF1', '#BD6B4E':'#F6E9E1', '#7A5C84':'#EFE8F2' };\n    const accentSoft = SOFTMAP[accentColor] || '#EEF1E8';\n    const showEvents = this.props.showCalendarEvents !== false;\n    const weekendShading = this.props.weekendShading !== false;\n    const seasonalThemes = this.props.seasonalThemes !== false;\n    // Per-month seasonal palette, keyed by calendar month (0=Jan … 11=Dec)\n    const THEME = {\n      0:  { a: '#3E6E8C', s: '#E2ECF2' }, // Jan — winter slate blue (New Year, MLK)\n      1:  { a: '#A8456A', s: '#F5E1E9' }, // Feb — berry rose (Valentine's)\n      2:  { a: '#4F8A52', s: '#E5F0E4' }, // Mar — fresh spring green (Spring Break)\n      3:  { a: '#B85A82', s: '#F6E2EC' }, // Apr — blossom pink (Easter, spring)\n      4:  { a: '#3C8A86', s: '#DEEFED' }, // May — teal (late spring, graduation)\n      5:  { a: '#3A78B0', s: '#E1ECF5' }, // Jun — summer azure\n      6:  { a: '#C0533C', s: '#F7E5DF' }, // Jul — sunlit terracotta (Independence Day)\n      7:  { a: '#B07A1E', s: '#F6EDD7' }, // Aug — late-summer goldenrod (back to school)\n      8:  { a: '#5F7E3E', s: '#EBF0E0' }, // Sep — early-autumn olive\n      9:  { a: '#B85A28', s: '#F7E7DA' }, // Oct — pumpkin orange (Fall Break, Halloween)\n      10: { a: '#9C4A2E', s: '#F2E2DB' }, // Nov — russet (Thanksgiving)\n      11: { a: '#2E6E4E', s: '#DEEDE4' }, // Dec — evergreen pine (Christmas)\n    };\n    const MN = ['January','February','March','April','May','June','July','August','September','October','November','December'];\n    const MS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n    const DAYFULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];\n    const addDays = (d, n) => new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() + n));\n    const inRange = (y, m) => (y > 2026 || (y === 2026 && m >= 6)) && (y < 2027 || (y === 2027 && m <= 5));\n\n    // --- ESD 2026–27 academic calendar events ---\n    // type: 'first' | 'last' | 'holiday' (no school) | 'misc'\n    const COLOR = {\n      first: '#4E6A3C', last:  '#4E6A3C', holiday: '#BF5A3C', misc: '#9C7A36', staff: '#9C7A36',\n    };\n    // Only these event types are shown; plain school 'misc' events are hidden.\n    const SHOW_TYPES = { first: 1, last: 1, holiday: 1, staff: 1 };\n    const TINT = { holiday: '#FBEEE8' };\n    const rawEvents = [\n      // [year, monthIndex0, day, type, label]\n      [2026,7,3,'misc','US Fall Sports Begin'],\n      [2026,7,4,'staff','New Faculty Onboarding'],[2026,7,5,'staff','New Faculty Onboarding'],\n      [2026,7,7,'staff','Inservice / Convocation'],\n      [2026,7,12,'misc','8th Gr. Colorado Mtg.'],\n      [2026,7,13,'misc','Freshmen Retreat'],[2026,7,14,'misc','Orientations / Retreat'],\n      [2026,7,15,'misc','Senior Retreat · 8th CO Trip'],[2026,7,16,'misc','Senior Retreat · 8th CO Trip'],\n      [2026,7,17,'misc','Orientation · 8th CO Trip'],[2026,7,18,'misc','Orientation · 8th CO Trip'],\n      [2026,7,19,'first','First Day MS/US'],[2026,7,20,'first','First Day Lower School'],\n      [2026,8,7,'holiday','Labor Day'],[2026,8,21,'holiday','Yom Kippur'],\n      [2026,8,22,'misc','Homecoming Week'],[2026,8,23,'misc','Homecoming Week'],[2026,8,24,'misc','Homecoming Week'],[2026,8,25,'misc','Homecoming Week'],\n      [2026,9,9,'holiday','Fall Break'],[2026,9,10,'holiday','Fall Break'],[2026,9,11,'holiday','Fall Break'],[2026,9,12,'holiday','Fall Break'],\n      [2026,10,4,'holiday','Conf. Day — No School'],\n      [2026,10,5,'misc','Fall SPC (DFW)'],[2026,10,6,'misc','Fall SPC (DFW)'],[2026,10,7,'misc','Fall SPC (DFW)'],\n      [2026,10,19,'misc','Grandparents Day 9 & 12'],[2026,10,20,'misc','Grandparents Day MS · Early Release'],\n      [2026,10,23,'holiday','Thanksgiving Break'],[2026,10,24,'holiday','Thanksgiving Break'],[2026,10,25,'holiday','Thanksgiving Break'],[2026,10,26,'holiday','Thanksgiving Break'],[2026,10,27,'holiday','Thanksgiving Break'],\n      [2026,11,9,'misc','Lessons & Carols'],\n      [2026,11,15,'misc','US Exams'],[2026,11,16,'misc','Exams US · 7/8'],[2026,11,17,'misc','Exams · Early Release'],\n      [2026,11,18,'holiday','Make-up Exams — No School'],\n      [2026,11,21,'holiday','Christmas Break Begins'],[2026,11,22,'holiday','Christmas Break'],[2026,11,23,'holiday','Christmas Break'],[2026,11,24,'holiday','Christmas Break'],[2026,11,25,'holiday','Christmas Break'],[2026,11,26,'holiday','Christmas Break'],[2026,11,27,'holiday','Christmas Break'],[2026,11,28,'holiday','Christmas Break'],[2026,11,29,'holiday','Christmas Break'],[2026,11,30,'holiday','Christmas Break'],[2026,11,31,'holiday','Christmas Break'],\n      [2027,0,1,'holiday','Christmas Break'],[2027,0,2,'holiday','Christmas Break'],[2027,0,3,'holiday','Christmas Break'],\n      [2027,0,4,'holiday','Inservice — No School'],[2027,0,5,'holiday','Inservice — No School'],\n      [2027,0,6,'first','Classes Resume'],[2027,0,18,'holiday','MLK Jr. Day'],\n      [2027,1,11,'misc','Winter SPC (Houston)'],\n      [2027,1,12,'holiday','Winter Break'],[2027,1,13,'holiday','Winter Break'],[2027,1,14,'holiday','Winter Break'],[2027,1,15,'holiday','Winter Break'],\n      [2027,1,24,'holiday','Conf. Day — No School'],\n      [2027,2,15,'holiday','Spring Break'],[2027,2,16,'holiday','Spring Break'],[2027,2,17,'holiday','Spring Break'],[2027,2,18,'holiday','Spring Break'],[2027,2,19,'holiday','Spring Break'],\n      [2027,2,22,'first','Classes Resume'],\n      [2027,2,26,'holiday','Easter Holiday'],[2027,2,27,'holiday','Easter Holiday'],[2027,2,28,'holiday','Easter Holiday'],[2027,2,29,'holiday','Easter Holiday'],\n      [2027,3,2,'misc','LS Grandparents’ Day'],[2027,3,28,'misc','Pass It On'],\n      [2027,3,29,'misc','Spring SPC (Dallas)'],[2027,3,30,'holiday','School Holiday (SPC)'],\n      [2027,4,1,'misc','Spring SPC (Dallas)'],\n      [2027,4,3,'misc','AP Exams Begin'],[2027,4,4,'misc','AP Exams'],[2027,4,5,'misc','AP Exams'],[2027,4,6,'misc','AP Exams'],[2027,4,7,'misc','AP Exams'],[2027,4,10,'misc','AP Exams'],[2027,4,11,'misc','AP Exams'],[2027,4,13,'misc','AP Exams'],[2027,4,14,'misc','AP Exams End'],\n      [2027,4,12,'misc','AP Exams · LS Conf. Day'],\n      [2027,4,18,'last','Last Day Gr. B–6 · US Exams'],[2027,4,19,'misc','Exams 7/8 & US'],\n      [2027,4,20,'last','Last Day 7–8 & US · Baccalaureate'],[2027,4,21,'misc','Graduation'],\n      [2027,4,24,'staff','Faculty In-service'],[2027,4,25,'staff','Faculty In-service'],[2027,4,26,'staff','Faculty In-service'],\n    ];\n    const evByKey = {};\n    rawEvents.forEach(([y, m, d, type, label]) => {\n      const k = y + '-' + m + '-' + d;\n      (evByKey[k] = evByKey[k] || []).push({ type, label, color: COLOR[type] });\n    });\n    const evFor = (d) => (evByKey[d.getUTCFullYear() + '-' + d.getUTCMonth() + '-' + d.getUTCDate()] || []).filter(e => SHOW_TYPES[e.type]);\n\n    // --- assign each school week (Mon–Fri) to a month by majority of weekdays (ties -> earlier) ---\n    const weeksByKey = {};\n    const first = new Date(Date.UTC(2026, 6, 1));            // Jul 1 2026\n    let mon = addDays(first, -(((first.getUTCDay() + 6) % 7))); // Monday on/before\n    for (let w = 0; w < 60; w++) {\n      const wd = [];\n      for (let k = 0; k < 5; k++) wd.push(addDays(mon, k)); // Mon..Fri\n      const count = {};\n      wd.forEach(d => { const k = d.getUTCFullYear() + '-' + d.getUTCMonth(); count[k] = (count[k] || 0) + 1; });\n      let best = null;\n      Object.keys(count).forEach(k => {\n        if (best === null) { best = k; return; }\n        const [ky, km] = k.split('-').map(Number);\n        const [by, bm] = best.split('-').map(Number);\n        if (count[k] > count[best] || (count[k] === count[best] && (ky < by || (ky === by && km < bm)))) best = k;\n      });\n      const [by, bm] = best.split('-').map(Number);\n      if (inRange(by, bm)) {\n        const fri = wd[4];\n        const sameM = mon.getUTCMonth() === fri.getUTCMonth();\n        const title = 'Week of ' + MN[mon.getUTCMonth()] + ' ' + mon.getUTCDate();\n        const range = MN[mon.getUTCMonth()] + ' ' + mon.getUTCDate() + ' – ' +\n          (sameM ? '' : MN[fri.getUTCMonth()] + ' ') + fri.getUTCDate() + ', ' + fri.getUTCFullYear();\n        const days = wd.map(d => {\n          const ev = showEvents ? evFor(d) : [];\n          return {\n            name: DAYFULL[d.getUTCDay()],\n            date: MS[d.getUTCMonth()] + ' ' + d.getUTCDate(),\n            events: ev,\n            hasEvents: ev.length > 0,\n            headerBg: ev.some(e => e.type === 'holiday') ? '#FBEEE8' : 'var(--soft,#EEF1E8)',\n          };\n        });\n        const mondayKey = mon.getUTCFullYear() + '-' + mon.getUTCMonth() + '-' + mon.getUTCDate();\n        (weeksByKey[by + '-' + bm] = weeksByKey[by + '-' + bm] || []).push({ title, range, days, mondayKey });\n      }\n      mon = addDays(mon, 7);\n      if (mon.getUTCFullYear() > 2027 || (mon.getUTCFullYear() === 2027 && mon.getUTCMonth() > 6)) break;\n    }\n\n    // --- build 12 months (week ids first, then cells so links can resolve) ---\n    const mondayToWeekId = {};\n    const months = [];\n    for (let i = 0; i < 12; i++) {\n      const y = 2026 + Math.floor((6 + i) / 12);\n      const m = (6 + i) % 12;\n      const wkArr = (weeksByKey[y + '-' + m] || []).map((wkObj, wi) => {\n        const id = 'w-' + i + '-' + wi;\n        mondayToWeekId[wkObj.mondayKey] = id;\n        return { ...wkObj, id, notesId: 'wn-' + i + '-' + wi };\n      });\n      months.push({ _y: y, _m: m, _i: i, weeks: wkArr });\n    }\n    // now that all week ids exist, build the calendar cells (cells can link forward/back)\n    months.forEach(M => {\n      const y = M._y, m = M._m;\n      const firstD = new Date(Date.UTC(y, m, 1));\n      const startOff = firstD.getUTCDay();\n      const dim = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();\n      const nWeeks = Math.ceil((startOff + dim) / 7);\n      const gridStart = addDays(firstD, -startOff);\n      const left = [], right = [];\n      for (let wk = 0; wk < nWeeks; wk++) {\n        for (let c = 0; c < 7; c++) {\n          const d = addDays(gridStart, wk * 7 + c);\n          const muted = d.getUTCMonth() !== m;\n          const weekend = (c === 0 || c === 6);\n          const ev = (muted || !showEvents) ? [] : evFor(d);\n          const isHol = ev.some(e => e.type === 'holiday');\n          const mk = d.getUTCFullYear() + '-' + d.getUTCMonth() + '-' + d.getUTCDate();\n          const href = (!muted && c === 1 && mondayToWeekId[mk]) ? '#' + mondayToWeekId[mk] : null;\n          const cell = {\n            label: String(d.getUTCDate()),\n            numColor: muted ? '#C4CBBC' : '#2E3528',\n            cellBg: muted ? '#FBFCFA' : (isHol ? TINT.holiday : (weekend && weekendShading ? '#F4F6EF' : '#ffffff')),\n            events: ev,\n            hasEvents: ev.length > 0,\n            href,\n            hasHref: !!href,\n          };\n          if (c <= 2) left.push(cell); else right.push(cell);\n        }\n      }\n      M.id = 'm-' + M._i; M.name = MN[m]; M.short = MS[m].toUpperCase();\n      M.year = String(y); M.leftCells = left; M.rightCells = right;\n      M.accent = seasonalThemes ? THEME[m].a : accentColor;\n      M.soft = seasonalThemes ? THEME[m].s : accentSoft;\n    });\n\n    const legend = [\n      { label: 'First / Last Day', color: COLOR.first },\n      { label: 'No School / Holiday', color: COLOR.holiday },\n      { label: 'Onboarding / Inservice', color: COLOR.staff },\n    ];\n\n    return {\n      months,\n      navMonths: months.map(mm => ({ id: mm.id, short: mm.short })),\n      leftDows: ['Sun', 'Mon', 'Tue'],\n      rightDows: ['Wed', 'Thu', 'Fri', 'Sat'],\n      legend,\n      accentColor,\n      accentSoft,\n      notesExtra: [1, 2, 3, 4, 5],\n    };\n  }\n  renderVals() {\n    const sig = JSON.stringify([this.props.accentColor, this.props.showCalendarEvents, this.props.weekendShading, this.props.seasonalThemes]);\n    if (this._sig !== sig) { this._d = this.build(); this._sig = sig; }\n    return this._d;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
