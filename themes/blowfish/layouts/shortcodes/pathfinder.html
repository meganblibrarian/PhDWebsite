<div id="pathfinder-app" class="not-prose min-h-screen bg-slate-950 text-slate-100 p-4 md:p-8 rounded-xl shadow-2xl border border-slate-800 my-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <div class="max-w-4xl mx-auto">
        <header class="mb-8 border-b border-slate-800 pb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-cyan-500 p-2 rounded-lg">
                    <i data-lucide="compass" class="text-slate-900 w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold uppercase tracking-tight">Pathfinder <span class="text-cyan-400 text-sm font-mono">PI</span></h1>
                    <p class="text-[10px] text-slate-500 font-mono tracking-widest uppercase">PhD Methodology Lab</p>
                </div>
            </div>

            <div id="stats-bar" class="flex gap-4 bg-slate-900/50 p-3 rounded-xl border border-slate-800">
                </div>
        </header>

        <div id="game-screen" class="max-w-3xl mx-auto">
            </div>

        <footer class="max-w-3xl mx-auto mt-12 text-center text-slate-600 text-[10px] uppercase tracking-[0.2em] font-bold pb-8">
            Qualitative Research Pathfinder // Threshold: 8/10 REQUIRED
        </footer>
    </div>

    <script>
        // --- GAME DATA ---
        const questions = [
            { q: "Methodological approaches to online studies should be chosen arbitrarily to maintain 'naturalistic' flow.", options: ["True", "False"], answer: 1, rationale: "Design must be grounded in the research purpose and paradigm." },
            { q: "Which qualitative traditions can be used in concert for online spaces?", options: ["Case study, ethnography, grounded theory, phenomenology", "Experimental, correlation, and survey", "Content, discourse, and historical review", "Action research only"], answer: 0, rationale: "These four are primary tools for addressing digital research questions." },
            { q: "Which theory posits learning as a cultural experience occurring 'in situ'?", options: ["Behaviorist", "Cognitive", "Sociocultural", "Sociocognitive"], answer: 2, rationale: "Sociocultural theories focus on learning in practice and context." },
            { q: "What constitutes an online field site?", options: ["Fixed elements only", "Moving elements only", "Network of fixed and moving elements", "Abstract sites only"], answer: 2, rationale: "Field sites are dynamic networks of spaces, people, and objects." },
            { q: "What is the researcher's primary task in modeling learning activity?", options: ["Self-reports", "Observe traces and build models", "Measure brain activity", "Measure server speed"], answer: 1, rationale: "Learning is inferential; we must build models from traces." },
            { q: "Justification for using multiple traditions?", options: ["Ease of analysis", "Avoiding paradigms", "Addressing research question and site complexity", "Mixing for static components"], answer: 2, rationale: "Pragmatism allows traditions to work together for complex sites." },
            { q: "Best strategy for handling diverse digital traces?", options: ["Exclude individual data", "Acknowledge complementary/contradictory theories", "Use behaviorism only", "Treat individual work as error"], answer: 1, rationale: "Different behaviors may require different theoretical lenses." },
            { q: "Why ignore offline components?", options: ["Static logs", "Fails to account for context/congruence", "Ethnography is invalid", "Logs aren't data"], answer: 1, rationale: "Offline context is vital for a holistic view of meaning-making." },
            { q: "How to handle the 'researcher as tool' role?", options: ["Delete accounts", "Reflexivity and familiarity", "Assume no impact", "Report only others"], answer: 1, rationale: "Reflexivity is mandatory when the researcher is the instrument." },
            { q: "The 'dynamic/static' nature of online spaces requires:", options: ["Rigidity", "Focus on flow only", "Flexibility and adaptability", "Automation"], answer: 2, rationale: "Complexity demands high researcher adaptability." }
        ];

        const stages = {
            welcome: {
                title: "Digital Fieldwork Pathfinder",
                subtitle: "PI Assignment",
                content: "You are the Lead Investigator for the 'Meta-Space Discord' study. Navigate the design phases and pass the validation exam to publish.",
                character: "Dr. Aris",
                message: "Qualitative research is a network. Be pragmatic.",
                options: [{ label: "Initialize Design", next: 'paradigm' }]
            },
            paradigm: {
                title: "The Paradigmatic Fork",
                subtitle: "Phase 1: Stance",
                content: "Choose your core tradition to determine your collection tools.",
                character: "IRB Liaison",
                message: "This choice determines the congruence of your study.",
                options: [
                    { label: "Ethnography", next: "ethnography", impact: { alignment: 10 } },
                    { label: "Phenomenology", next: "phenomenology", impact: { alignment: 10 } }
                ]
            },
            ethnography: {
                title: "The Shifting Site",
                subtitle: "Phase 2: Flow",
                content: "The community moves to encrypted voice. Your text scraper is failing.",
                character: "Field Notes",
                message: "Digital culture is flow. Do you adapt?",
                options: [
                    { label: "Stick to Static", next: "fail_static", impact: { adaptability: -10 } },
                    { label: "Pivot to Flow", next: "trace", impact: { adaptability: 20 } }
                ]
            },
            phenomenology: {
                title: "The Myopia Trap",
                subtitle: "Phase 2: Offline",
                content: "A participant says school firewalls restrict their online growth.",
                character: "User T-04",
                message: "My offline world shapes my online life. See both?",
                options: [
                    { label: "Online Only", next: "fail_myopia", impact: { alignment: -10 } },
                    { label: "Address Offline", next: "trace", impact: { alignment: 15, reflexivity: 10 } }
                ]
            },
            trace: {
                title: "Learning Traces",
                subtitle: "Phase 3: Modeling",
                content: "Educators are collaborating. Choose your lens.",
                character: "Analyst",
                message: "We only see traces. How will you model it?",
                options: [
                    { label: "Behaviorist", next: "trace_feedback", impact: { alignment: 5 } },
                    { label: "Sociocultural", next: "quiz_intro", impact: { alignment: 15 } }
                ]
            },
            quiz_intro: {
                title: "Methodological Validation",
                subtitle: "Final Verification",
                content: "Fieldwork is complete. Score 8/10 on the exam to publish.",
                character: "The Dean",
                message: "Theory must support practice. Begin the exam.",
                options: [{ label: "Start Exam", next: "quiz" }]
            },
            fail_static: { title: "Data Stagnation", content: "Your study failed to capture the community's evolution.", character: "Reviewer", message: "Revise your lens.", options: [{ label: "Restart", next: "welcome", reset: true }] },
            fail_myopia: { title: "Myopia Detected", content: "You missed the physical context of learning.", character: "Advisor", message: "Broaden your scope.", options: [{ label: "Restart", next: "welcome", reset: true }] },
            trace_feedback: { title: "Thin Description", content: "Simple stats don't explain cultural learning.", character: "Dr. Aris", message: "Try a more nuanced lens.", options: [{ label: "Back", next: "trace" }] }
        };

        // --- STATE & ENGINE ---
        let app = {
            stage: 'welcome',
            stats: { reflexivity: 0, alignment: 0, adaptability: 0 },
            quizIndex: 0,
            score: 0,
            isQuizMode: false,
            showFeedback: false,
            lastCorrect: false
        };

        function render() {
            const screen = document.getElementById('game-screen');
            updateStats();

            if (app.stage === 'quiz') return renderQuiz();
            if (app.stage === 'results') return renderResults();

            const current = stages[app.stage];
            screen.innerHTML = `
                <div class="fade-in space-y-6">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl">
                        <div class="mb-4">
                            <span class="text-cyan-400 text-xs font-bold uppercase tracking-widest">${current.subtitle || ''}</span>
                            <h2 class="text-2xl font-bold">${current.title}</h2>
                        </div>
                        <p class="text-slate-300 text-lg mb-6">${current.content}</p>
                        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 italic text-slate-400 text-sm flex gap-3">
                             <i data-lucide="users" class="w-5 h-5 text-cyan-500 shrink-0"></i>
                             <div><b class="text-cyan-500 not-italic block uppercase text-[10px]">${current.character}</b> "${current.message}"</div>
                        </div>
                        <div class="grid gap-3 mt-8">
                            ${current.options.map((opt, i) => `
                                <button onclick="handleChoice('${opt.next}', ${i})" class="w-full text-left p-4 rounded-xl border border-slate-800 bg-slate-900/50 hover:border-cyan-500 hover:bg-slate-800 transition-all flex justify-between items-center group">
                                    <span class="font-bold group-hover:text-cyan-400 uppercase">${opt.label}</span>
                                    <i data-lucide="chevron-right" class="w-5 h-5 text-slate-600"></i>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function renderQuiz() {
            const screen = document.getElementById('game-screen');
            const q = questions[app.quizIndex];

            if (app.showFeedback) {
                screen.innerHTML = `
                <div class="fade-in bg-slate-900 border ${app.lastCorrect ? 'border-emerald-500/50' : 'border-rose-500/50'} rounded-2xl p-8">
                    <div class="flex items-center gap-3 mb-4">
                        <i data-lucide="${app.lastCorrect ? 'check-circle' : 'alert-circle'}" class="${app.lastCorrect ? 'text-emerald-400' : 'text-rose-400'}"></i>
                        <span class="font-bold uppercase tracking-widest text-sm ${app.lastCorrect ? 'text-emerald-400' : 'text-rose-400'}">
                            ${app.lastCorrect ? 'Correct' : 'Incorrect'}
                        </span>
                    </div>
                    <p class="text-slate-300 text-lg mb-6">${q.rationale}</p>
                    <button onclick="nextQuestion()" class="w-full bg-cyan-600 p-4 rounded-xl font-bold hover:bg-cyan-500 transition-all uppercase">
                        ${app.quizIndex === questions.length - 1 ? 'See Results' : 'Next Question'}
                    </button>
                </div>`;
            } else {
                screen.innerHTML = `
                <div class="fade-in bg-slate-900 border border-slate-800 rounded-2xl p-8">
                    <div class="flex justify-between mb-6 text-xs font-mono text-slate-500 uppercase">
                        <span>Question ${app.quizIndex + 1}/10</span>
                        <span>Score: ${app.score}</span>
                    </div>
                    <h3 class="text-xl font-bold mb-8">${q.q}</h3>
                    <div class="grid gap-3">
                        ${q.options.map((opt, i) => `
                            <button onclick="answerQuiz(${i})" class="w-full text-left p-4 rounded-xl border border-slate-800 bg-slate-950 hover:border-cyan-500 transition-all">
                                <span class="text-cyan-500 font-mono mr-3">[${String.fromCharCode(65+i)}]</span> ${opt}
                            </button>
                        `).join('')}
                    </div>
                </div>`;
            }
            lucide.createIcons();
        }

        function renderResults() {
            const passed = app.score >= 8;
            const screen = document.getElementById('game-screen');
            screen.innerHTML = `
                <div class="fade-in text-center bg-slate-900 border ${passed ? 'border-emerald-500' : 'border-rose-500'} rounded-2xl p-12">
                    <i data-lucide="${passed ? 'shield-check' : 'file-x'}" class="w-16 h-16 mx-auto mb-6 ${passed ? 'text-emerald-400' : 'text-rose-400'}"></i>
                    <h2 class="text-3xl font-bold mb-2">${passed ? 'Research Published' : 'Revise & Resubmit'}</h2>
                    <p class="text-slate-400 mb-8">${passed ? 'Your study has been accepted into the Journal of Digital Learning.' : 'Your theoretical mastery score (' + app.score + '/10) is below the required 80%.'}</p>
                    <button onclick="resetGame()" class="bg-slate-100 text-slate-900 px-8 py-4 rounded-xl font-bold hover:bg-white transition-all uppercase">
                        ${passed ? 'New Research Cycle' : 'Try Again'}
                    </button>
                </div>
            `;
            lucide.createIcons();
        }

        function handleChoice(next, optIdx) {
            const opt = stages[app.stage].options[optIdx];
            if (opt.impact) {
                for (let s in opt.impact) app.stats[s] = Math.min(100, Math.max(0, app.stats[s] + opt.impact[s]));
            }
            if (opt.reset) resetGame();
            app.stage = next;
            render();
        }

        function answerQuiz(idx) {
            app.lastCorrect = (idx === questions[app.quizIndex].answer);
            if (app.lastCorrect) app.score++;
            app.showFeedback = true;
            renderQuiz();
        }

        function nextQuestion() {
            app.showFeedback = false;
            if (app.quizIndex < questions.length - 1) {
                app.quizIndex++;
                renderQuiz();
            } else {
                app.stage = 'results';
                render();
            }
        }

        function updateStats() {
            const bar = document.getElementById('stats-bar');
            const items = [
                { l: 'Reflexivity', v: app.stats.reflexivity, c: 'bg-cyan-400' },
                { l: 'Alignment', v: app.stats.alignment, c: 'bg-emerald-400' },
                { l: 'Adaptability', v: app.stats.adaptability, c: 'bg-amber-400' }
            ];
            bar.innerHTML = items.map(i => `
                <div class="flex flex-col items-center">
                    <span class="text-[9px] text-slate-500 font-bold uppercase mb-1">${i.l}</span>
                    <div class="w-16 h-1 bg-slate-800 rounded-full"><div class="${i.c} h-full transition-all" style="width:${i.v}%"></div></div>
                </div>
            `).join('');
        }

        function resetGame() {
            app = { stage: 'welcome', stats: { reflexivity: 0, alignment: 0, adaptability: 0 }, quizIndex: 0, score: 0, isQuizMode: false, showFeedback: false, lastCorrect: false };
            render();
        }

        // Init
        render();
    </script>

    <style>
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #pathfinder-app button { cursor: pointer; }
    </style>
</div>
